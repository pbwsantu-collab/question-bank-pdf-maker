<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Create print-ready, space-efficient 2-column question bank PDFs. Works offline." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Question Bank PDF Maker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d2d44;
      --success: #10b981;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem;
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      margin-top: 0.75rem;
    }
    .badge.offline {
      background: #7f1d1d;
      color: #fecaca;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }
    input[type="text"],
    textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea {
      min-height: 220px;
      line-height: 1.45;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.85rem;
      margin-top: 0.5rem;
    }
    .control label {
      font-size: 0.8rem;
    }
    .control input[type="number"],
    .control input[type="range"] {
      width: 100%;
    }
    input[type="number"] {
      background: #0f0f1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.65rem;
      font-size: 0.9rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 1rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.75rem;
      min-height: 1.25rem;
    }
    .status.ok { color: var(--success); }
    .status.err { color: #f87171; }
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.5rem;
      padding-bottom: 1rem;
    }
    .install-banner {
      display: none;
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      right: 1rem;
      max-width: 400px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      z-index: 50;
      align-items: center;
      gap: 0.75rem;
    }
    .install-banner.show { display: flex; }
    .install-banner p { flex: 1; font-size: 0.9rem; }
    .install-banner button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Question Bank PDF Maker</h1>
      <p class="subtitle">Print-ready 2-column PDFs · Offline · Installable</p>
      <span class="badge offline" id="offlineBadge" style="display:none">Offline</span>
    </header>

    <div class="card">
      <label for="title">Title (optional)</label>
      <input type="text" id="title" placeholder="e.g. Physics Chapter 5 – Practice Questions" />
    </div>

    <div class="card">
      <label for="questions">Questions</label>
      <textarea id="questions" placeholder="Paste or type questions here.\n\nSeparate each question with a blank line.\n\nExample:\n\n1. What is Newton's second law?\n\n2. Derive the equation for kinetic energy.\n\n3. Explain the difference between mass and weight."></textarea>
      <p class="hint">Separate questions with a blank line. Every word is preserved exactly.</p>
    </div>

    <div class="card">
      <div class="controls">
        <div class="control">
          <label for="fontSize">Font size (pt)</label>
          <input type="number" id="fontSize" min="6" max="12" step="0.5" value="8" />
        </div>
        <div class="control">
          <label for="margin">Margin (mm)</label>
          <input type="number" id="margin" min="6" max="20" step="1" value="10" />
        </div>
        <div class="control">
          <label for="colGap">Column gap (mm)</label>
          <input type="number" id="colGap" min="4" max="15" step="1" value="6" />
        </div>
        <div class="control">
          <label for="lineHeight">Line height</label>
          <input type="number" id="lineHeight" min="1.0" max="1.6" step="0.05" value="1.25" />
        </div>
      </div>
    </div>

    <button class="btn" id="generateBtn">Generate PDF</button>
    <p class="status" id="status"></p>

    <footer>
      Works fully offline after first load • Installable on phone &amp; desktop • No data leaves your device
    </footer>
  </div>

  <div class="install-banner" id="installBanner">
    <p>Install this app for quick offline access</p>
    <button id="installBtn">Install</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
